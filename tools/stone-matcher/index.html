<!doctype html>
<!--
  Stone matcher tester. Throwaway experiment, not part of the app.

  Question it answers: given one reference photo of a gravestone, can the browser find that stone in a
  video and keep an outline on it without jumping to a neighbour?

  Open this file in Chrome, pick the reference photo and the video, press play. Nothing is uploaded;
  OpenCV.js is the only download (about 10 MB, from jsDelivr).

  How it works: a worker matches the reference against a frame (slow, about half a second), and the page
  follows the outline between matches with optical flow (fast). In the app the AR world tracker would do
  the following, so only the matcher's hit rate carries over.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stone matcher tester</title>
<style>
  :root { color-scheme: dark; --bg: #0b1210; --panel: #14201c; --line: #24342e; --text: #e6efe9; --dim: #8fa39a; --amber: #f59e0b; --green: #22c55e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 14px 16px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  h1 { font-size: 16px; margin: 0; }
  #engine { color: var(--dim); font-size: 12px; }
  main { padding: 8px 16px 24px; display: grid; gap: 14px; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 8px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 3px; }
  input[type=file], select, input[type=number] { width: 100%; background: #0e1815; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--text); font-size: 13px; }
  .check input { width: auto; }
  button { background: #1d2e28; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #26392f; }
  #refCanvas { width: 100%; display: block; border-radius: 6px; background: #0e1815; touch-action: none; cursor: crosshair; }
  #refInfo, .hint { font-size: 12px; color: var(--dim); margin-top: 6px; }
  #stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; }
  #video { display: block; width: 100%; height: auto; max-height: 78vh; }
  #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
  #status { font-size: 15px; font-weight: 600; margin: 10px 0 2px; }
  #status.potential { color: var(--amber); }
  #status.likely { color: var(--green); }
  #readout { font: 12px/1.6 ui-monospace, Consolas, monospace; color: var(--dim); white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Stone matcher tester</h1>
  <span id="engine">Loading OpenCV.js…</span>
</header>
<main>
  <section class="panel">
    <h2>Reference</h2>
    <label for="refFile">Reference photo</label>
    <input id="refFile" type="file" accept="image/*">
    <canvas id="refCanvas" width="320" height="200" style="margin-top:10px"></canvas>
    <div class="hint">Drag a box around the stone to ignore the background.</div>
    <div style="margin-top:8px"><button id="refWhole" type="button">Use whole photo</button></div>
    <div id="refInfo"></div>

    <h2 style="margin-top:18px">Matcher</h2>
    <div class="row">
      <div><label for="method">Features</label><select id="method"></select></div>
      <div><label for="procSize">Frame size (px)</label>
        <select id="procSize"><option>640</option><option selected>960</option><option>1280</option><option>1600</option></select></div>
    </div>
    <div class="row">
      <div><label for="ratio">Ratio test</label><input id="ratio" type="number" min="0.5" max="0.95" step="0.05" value="0.75"></div>
      <div><label for="maxRate">Max matches / s</label><input id="maxRate" type="number" min="1" max="30" step="1" value="10"></div>
    </div>
    <div class="row">
      <div><label for="potential">Potential at inliers ≥</label><input id="potential" type="number" min="4" max="200" step="1" value="10"></div>
      <div><label for="likely">Likely at inliers ≥</label><input id="likely" type="number" min="4" max="400" step="1" value="20"></div>
    </div>
    <div class="row">
      <div><label for="stableFrames">Stable frames</label><input id="stableFrames" type="number" min="1" max="30" step="1" value="3"></div>
      <div><label for="rate">Playback speed</label>
        <select id="rate"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select></div>
    </div>
    <label for="akazeThreshold">AKAZE threshold (lower finds more points, slower)</label>
    <select id="akazeThreshold"><option>0.001</option><option selected>0.0006</option><option>0.0003</option></select>
    <label class="check"><input id="showPoints" type="checkbox" checked> Show matched points</label>
  </section>

  <section class="panel">
    <h2>Video</h2>
    <input id="videoFile" type="file" accept="video/*">
    <div id="stage" style="margin-top:10px">
      <video id="video" controls playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="status">Pick a reference photo and a video</div>
    <div id="readout"></div>
    <div style="margin-top:8px"><button id="resetStats" type="button">Reset counts</button></div>
  </section>
</main>

<script>
// Runs inside the worker, so it must not touch anything outside its own body. It owns the slow part:
// finding the reference in one frame.
function workerMain(cvUrl) {
  const ORB_FEATURES_REF = 600;
  const ORB_FEATURES_FRAME = 2000;
  const RANSAC_REPROJ_PX = 4;
  // With no crop the photo also shows the base and the ground, so the outline is drawn around the part of
  // the photo that has actually been matching over the last few frames instead of around the whole photo
  const EVIDENCE_FRAMES = 12;
  const EVIDENCE_MIN_POINTS = 8;
  const EVIDENCE_PAD = 0.15;

  let cv = null;
  let detectorRef = null, detectorFrame = null, matcher = null, method = '';
  let reference = null; // { desc, pts, w, h }
  let hasCrop = false;
  // Reference coordinates of the inliers from recent matched frames, newest last
  let evidence = [];

  function makeDetector(name, orbFeatures, akazeThreshold) {
    if (name === 'ORB') {
      try { return new cv.ORB(orbFeatures); } catch (e) {
        const orb = new cv.ORB();
        if (orb.setMaxFeatures) orb.setMaxFeatures(orbFeatures);
        return orb;
      }
    }
    const detector = new cv[name]();
    // OpenCV's default is 0.001; dull engraved stone needs less to yield keypoints
    if (name === 'AKAZE' && detector.setThreshold) detector.setThreshold(akazeThreshold || 0.001);
    return detector;
  }

  function configure(msg) {
    for (const d of [detectorRef, detectorFrame, matcher]) if (d) d.delete();
    method = msg.method;
    detectorRef = makeDetector(method, ORB_FEATURES_REF, msg.akazeThreshold);
    detectorFrame = makeDetector(method, ORB_FEATURES_FRAME, msg.akazeThreshold);
    matcher = new cv.BFMatcher(method === 'SIFT' ? cv.NORM_L2 : cv.NORM_HAMMING, false);
  }

  function toImageData(frame) {
    return new ImageData(new Uint8ClampedArray(frame.data), frame.width, frame.height);
  }

  function buildReference(msg) {
    if (reference) { reference.desc.delete(); reference = null; }
    evidence = [];
    hasCrop = msg.hasCrop;
    const chunks = [], pts = [];
    let sizes = 0;
    for (const level of msg.levels) {
      const src = cv.matFromImageData(toImageData(level.image));
      const gray = new cv.Mat(), none = new cv.Mat(), kps = new cv.KeyPointVector(), desc = new cv.Mat();
      try {
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        detectorRef.detectAndCompute(gray, none, kps, desc);
        if (desc.rows > 0) {
          // Keypoints go back to full-scale reference coordinates so every copy shares one outline
          for (let i = 0; i < kps.size(); i++) { const p = kps.get(i).pt; pts.push(p.x / level.s, p.y / level.s); }
          chunks.push(desc.clone());
          sizes++;
        }
      } finally { src.delete(); gray.delete(); none.delete(); kps.delete(); desc.delete(); }
    }
    const total = chunks.reduce((n, c) => n + c.rows, 0);
    if (total > 0) {
      const merged = new cv.Mat(total, chunks[0].cols, chunks[0].type());
      let offset = 0;
      for (const c of chunks) { merged.data.set(c.data, offset); offset += c.data.length; c.delete(); }
      reference = { desc: merged, pts: Float32Array.from(pts), w: msg.w, h: msg.h };
    }
    postMessage({ type: 'reference', count: total, sizes, method, w: msg.w, h: msg.h });
  }

  function quadArea(q) {
    let a = 0;
    for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; }
    return Math.abs(a) / 2;
  }

  function isSaneQuad(q, frameW, frameH) {
    let sign = 0;
    for (let i = 0; i < 4; i++) {
      const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
      const cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
      if (cross === 0) return false;
      if (sign === 0) sign = Math.sign(cross); else if (Math.sign(cross) !== sign) return false;
    }
    const area = quadArea(q);
    if (area < frameW * frameH * 0.0005 || area > frameW * frameH * 0.95) return false;
    const side = (i) => Math.hypot(q[(i + 1) % 4].x - q[i].x, q[(i + 1) % 4].y - q[i].y);
    const r1 = side(0) / side(2), r2 = side(1) / side(3);
    return r1 > 1 / 3 && r1 < 3 && r2 > 1 / 3 && r2 < 3;
  }

  // The part of the reference to outline: the crop when there is one, else the box that holds the middle
  // 90% of recently matched points, padded
  function outlineRect(current) {
    const full = { x0: 0, y0: 0, x1: reference.w, y1: reference.h };
    if (hasCrop) return full;
    const xs = [], ys = [];
    for (const pts of [...evidence, current]) for (const p of pts) { xs.push(p.x); ys.push(p.y); }
    if (xs.length < EVIDENCE_MIN_POINTS) return full;
    xs.sort((a, b) => a - b); ys.sort((a, b) => a - b);
    const at = (arr, q) => arr[Math.min(arr.length - 1, Math.floor(arr.length * q))];
    const x0 = at(xs, 0.05), x1 = at(xs, 0.95), y0 = at(ys, 0.05), y1 = at(ys, 0.95);
    if (x1 - x0 < 8 || y1 - y0 < 8) return full;
    const px = (x1 - x0) * EVIDENCE_PAD, py = (y1 - y0) * EVIDENCE_PAD;
    return { x0: Math.max(0, x0 - px), y0: Math.max(0, y0 - py), x1: Math.min(reference.w, x1 + px), y1: Math.min(reference.h, y1 + py) };
  }

  // Finds the reference in one frame. Returns the outline in frame pixels, or quad: null with the counts
  // that explain why.
  function matchFrame(msg) {
    const started = performance.now();
    const out = { quad: null, inliers: 0, good: 0, frameFeatures: 0, points: [], ms: 0 };
    if (!reference) return out;
    const src = cv.matFromImageData(toImageData(msg.image));
    const gray = new cv.Mat(), none = new cv.Mat(), kps = new cv.KeyPointVector(), desc = new cv.Mat();
    const matches = new cv.DMatchVectorVector();
    let srcMat = null, dstMat = null, mask = null, H = null, corners = null, projected = null;
    try {
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      detectorFrame.detectAndCompute(gray, none, kps, desc);
      out.frameFeatures = desc.rows;
      if (desc.rows < 2) return out;

      // Reference to frame, so the same reference point seen at several sizes never competes with itself
      // in the ratio test. Several reference features can land on one frame point; keep the closest.
      matcher.knnMatch(reference.desc, desc, matches, 2);
      const bestByFramePoint = new Map();
      for (let i = 0; i < matches.size(); i++) {
        const pair = matches.get(i);
        if (pair.size() >= 2) {
          const m = pair.get(0), n = pair.get(1);
          if (m.distance < msg.ratio * n.distance) {
            const prev = bestByFramePoint.get(m.trainIdx);
            if (!prev || m.distance < prev.distance) bestByFramePoint.set(m.trainIdx, m);
          }
        }
        pair.delete();
      }
      out.good = bestByFramePoint.size;
      if (out.good < 4) return out;

      const from = [], to = [];
      for (const m of bestByFramePoint.values()) {
        from.push(reference.pts[m.queryIdx * 2], reference.pts[m.queryIdx * 2 + 1]);
        const p = kps.get(m.trainIdx).pt;
        to.push(p.x, p.y);
      }
      srcMat = cv.matFromArray(out.good, 1, cv.CV_32FC2, from);
      dstMat = cv.matFromArray(out.good, 1, cv.CV_32FC2, to);
      mask = new cv.Mat();
      H = cv.findHomography(srcMat, dstMat, cv.RANSAC, RANSAC_REPROJ_PX, mask);
      if (!H || H.rows !== 3) return out;

      const refPoints = [];
      for (let i = 0; i < mask.rows; i++) {
        if (mask.data[i]) {
          out.inliers++;
          out.points.push({ x: to[i * 2], y: to[i * 2 + 1] });
          refPoints.push({ x: from[i * 2], y: from[i * 2 + 1] });
        }
      }
      const r = outlineRect(refPoints);
      corners = cv.matFromArray(4, 1, cv.CV_32FC2, [r.x0, r.y0, r.x1, r.y0, r.x1, r.y1, r.x0, r.y1]);
      projected = new cv.Mat();
      cv.perspectiveTransform(corners, projected, H);
      const d = projected.data32F;
      const quad = [0, 1, 2, 3].map((i) => ({ x: d[i * 2], y: d[i * 2 + 1] }));
      if (quad.every((p) => Number.isFinite(p.x) && Number.isFinite(p.y)) && isSaneQuad(quad, msg.image.width, msg.image.height)) {
        out.quad = quad;
        if (out.inliers >= msg.potential) {
          evidence.push(refPoints);
          if (evidence.length > EVIDENCE_FRAMES) evidence.shift();
        }
      }
      return out;
    } finally {
      for (const m of [src, gray, none, kps, desc, matches, srcMat, dstMat, mask, H, corners, projected]) if (m) m.delete();
      out.ms = performance.now() - started;
    }
  }

  self.onmessage = (e) => {
    const msg = e.data;
    try {
      if (msg.type === 'config') configure(msg);
      else if (msg.type === 'reference') buildReference(msg);
      else if (msg.type === 'reset') evidence = [];
      else if (msg.type === 'match') postMessage({ type: 'result', id: msg.id, result: matchFrame(msg) });
    } catch (err) {
      postMessage({ type: 'error', id: msg.id, message: String(err && err.message ? err.message : err) });
    }
  };

  try { importScripts(cvUrl); } catch (err) { postMessage({ type: 'fatal', message: 'OpenCV.js could not be downloaded' }); return; }
  let hooked = false;
  const timer = setInterval(() => {
    const c = self.cv;
    if (c && c.Mat) {
      clearInterval(timer);
      cv = c;
      postMessage({ type: 'ready', methods: ['AKAZE', 'ORB', 'SIFT', 'BRISK'].filter((name) => typeof cv[name] === 'function') });
    } else if (c && c instanceof Promise && !hooked) { hooked = true; c.then((m) => { self.cv = m; }); }
  }, 100);
}

(() => {
  'use strict';

  const CV_URL = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
  const $ = (id) => document.getElementById(id);
  const engineEl = $('engine'), refCanvas = $('refCanvas'), refInfo = $('refInfo');
  const video = $('video'), overlay = $('overlay'), statusEl = $('status'), readoutEl = $('readout');
  const methodSel = $('method');

  // Longest side of the reference at full scale, and the smaller copies matched alongside it. A close-up
  // photo shows the stone far larger than the video does, so the smaller copies cover that gap.
  const REF_BASE = 800;
  const REF_SCALES = [1, 0.6, 0.35, 0.2];
  const REF_MIN_SIDE = 48;
  // Optical flow between matches, on a smaller copy of the frame so it fits inside one video frame's time
  const FLOW_SCALE = 0.5;
  const LK_MAX_CORNERS = 120;
  const LK_MIN_POINTS = 8;
  // The outline survives this many failed matches in a row, or this long without a good one
  const MAX_MISSES = 3;
  const HOLD_MS = 3000;
  const FADE_FROM_MS = 2000;
  const SMOOTH_ALPHA = 0.6;
  const IDENTITY = [1, 0, 0, 0, 1, 0, 0, 0, 1];

  let cv = null; // main-thread OpenCV, used only for optical flow
  let workerReady = false;
  let refImage = null;
  let crop = null; // { x, y, w, h } in image pixels, or null for the whole photo
  let reference = null; // { w, h, count } once the worker has read it
  const procCanvas = document.createElement('canvas');
  const pctx = procCanvas.getContext('2d', { willReadFrequently: true });
  const flowCanvas = document.createElement('canvas');
  const fctx = flowCanvas.getContext('2d', { willReadFrequently: true });

  // quad and points are in pixels of the matched frame size (frameW x frameH)
  const state = { quad: null, points: [], frameW: 1, frameH: 1, status: 'scanning', stable: 0, misses: 0, lastSeenAt: 0, last: null };
  const counts = { processed: 0, matched: 0, likely: 0, msTotal: 0 };
  let prevGray = null;
  let trackMs = 0;
  // The match in flight: H carries its answer forward from the frame it was asked about to the frame on screen
  let pending = null;
  let busy = false, wantMatch = false, nextId = 0, lastSentAt = 0;
  // Bumped whenever answers in flight stop being meaningful (seek, new reference, new video)
  let epoch = 0;
  let waiters = [];

  const cfg = () => ({
    ratio: +$('ratio').value || 0.75,
    potential: +$('potential').value || 10,
    likely: +$('likely').value || 20,
    stableFrames: +$('stableFrames').value || 3,
    maxRate: +$('maxRate').value || 10,
    procSize: +$('procSize').value || 960,
  });

  // ---------- Small geometry helpers ----------

  const mul3 = (a, b) => {
    const o = new Array(9);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) o[r * 3 + c] = a[r * 3] * b[c] + a[r * 3 + 1] * b[3 + c] + a[r * 3 + 2] * b[6 + c];
    return o;
  };
  const applyH = (h, p) => {
    const w = h[6] * p.x + h[7] * p.y + h[8];
    return { x: (h[0] * p.x + h[1] * p.y + h[2]) / w, y: (h[3] * p.x + h[4] * p.y + h[5]) / w };
  };
  const centre = (q) => ({ x: (q[0].x + q[1].x + q[2].x + q[3].x) / 4, y: (q[0].y + q[1].y + q[2].y + q[3].y) / 4 });
  function quadArea(q) {
    let a = 0;
    for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; }
    return Math.abs(a) / 2;
  }
  function isUsableQuad(q, frameW, frameH) {
    if (!q.every((p) => Number.isFinite(p.x) && Number.isFinite(p.y))) return false;
    let sign = 0;
    for (let i = 0; i < 4; i++) {
      const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
      const cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
      if (cross === 0) return false;
      if (sign === 0) sign = Math.sign(cross); else if (Math.sign(cross) !== sign) return false;
    }
    const area = quadArea(q);
    if (area < frameW * frameH * 0.0005 || area > frameW * frameH * 1.5) return false;
    // Followed out of the picture
    const c = centre(q);
    return c.x > -frameW * 0.1 && c.x < frameW * 1.1 && c.y > -frameH * 0.1 && c.y < frameH * 1.1;
  }

  // ---------- Main-thread OpenCV (optical flow only) ----------

  // The OpenCV.js builds differ in how they announce readiness (callback, promise, or thenable module),
  // so poll for the one thing that matters: cv.Mat exists
  function waitForCv() {
    return new Promise((resolve, reject) => {
      const started = Date.now();
      let hooked = false;
      const tick = () => {
        const c = window.cv;
        if (c && c.Mat) { cv = c; resolve(); return; }
        if (c && c instanceof Promise && !hooked) { hooked = true; c.then((m) => { window.cv = m; }); }
        if (Date.now() - started > 90000) { reject(new Error('OpenCV.js did not start')); return; }
        setTimeout(tick, 100);
      };
      tick();
    });
  }

  // How the picture moved from one frame to the next, as a 3 x 3 homography. While a stone is being
  // followed only its own neighbourhood is measured, so the outline moves with the stone, not the scene.
  function stepHomography(prev, next, quad) {
    const corners = new cv.Mat(), moved = new cv.Mat(), status = new cv.Mat(), err = new cv.Mat(), none = new cv.Mat();
    let mask = null, p0 = null, p1 = null, H = null;
    try {
      if (quad) {
        const xs = quad.map((p) => p.x), ys = quad.map((p) => p.y);
        const x = Math.max(0, Math.floor(Math.min(...xs))), y = Math.max(0, Math.floor(Math.min(...ys)));
        const w = Math.min(prev.cols, Math.ceil(Math.max(...xs))) - x, h = Math.min(prev.rows, Math.ceil(Math.max(...ys))) - y;
        if (w > 16 && h > 16) {
          mask = cv.Mat.zeros(prev.rows, prev.cols, cv.CV_8UC1);
          const roi = mask.roi(new cv.Rect(x, y, w, h));
          roi.setTo(new cv.Scalar(255));
          roi.delete();
        }
      }
      cv.goodFeaturesToTrack(prev, corners, LK_MAX_CORNERS, 0.01, 6, mask || none, 3);
      if (corners.rows < LK_MIN_POINTS && mask) cv.goodFeaturesToTrack(prev, corners, LK_MAX_CORNERS, 0.01, 6, none, 3);
      if (corners.rows < LK_MIN_POINTS) return null;

      const criteria = new cv.TermCriteria(cv.TERM_CRITERIA_EPS | cv.TERM_CRITERIA_COUNT, 20, 0.03);
      cv.calcOpticalFlowPyrLK(prev, next, corners, moved, status, err, new cv.Size(21, 21), 3, criteria);
      const a = [], b = [];
      for (let i = 0; i < status.rows; i++) {
        if (status.data[i] === 1) {
          a.push(corners.data32F[i * 2], corners.data32F[i * 2 + 1]);
          b.push(moved.data32F[i * 2], moved.data32F[i * 2 + 1]);
        }
      }
      if (a.length / 2 < LK_MIN_POINTS) return null;
      p0 = cv.matFromArray(a.length / 2, 1, cv.CV_32FC2, a);
      p1 = cv.matFromArray(b.length / 2, 1, cv.CV_32FC2, b);
      H = cv.findHomography(p0, p1, cv.RANSAC, 3);
      if (!H || H.rows !== 3) return null;
      const h = Array.from(H.data64F);
      return h.every(Number.isFinite) ? h : null;
    } finally {
      for (const m of [corners, moved, status, err, none, mask, p0, p1, H]) if (m) m.delete();
    }
  }

  // ---------- Worker ----------

  const worker = new Worker(URL.createObjectURL(new Blob([`(${workerMain.toString()})(${JSON.stringify(CV_URL)})`], { type: 'text/javascript' })));
  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'ready') {
      if (msg.methods.length === 0) { engineEl.textContent = 'This OpenCV.js build has no feature detectors'; return; }
      methodSel.innerHTML = msg.methods.map((m) => `<option>${m}</option>`).join('');
      workerReady = true;
      engineEl.textContent = `Matcher ready. Methods: ${msg.methods.join(', ')}`;
      sendConfig();
      buildReference();
    } else if (msg.type === 'reference') {
      reference = msg.count > 0 ? { w: msg.w, h: msg.h, count: msg.count } : null;
      refInfo.textContent = msg.count === 0
        ? 'No features found in the reference. Try another method or a sharper photo.'
        : `${msg.count} ${msg.method} features over ${msg.sizes} sizes, ${msg.w} x ${msg.h} px.` + (msg.count < 80 ? ' That is few. Expect weak matching.' : '');
      render();
      if (video.paused && video.videoWidth) tick(true);
    } else if (msg.type === 'result' || msg.type === 'error') {
      if (msg.type === 'error') { console.error(msg.message); engineEl.textContent = `Matcher error: ${msg.message}`; }
      if (msg.id === undefined) return;
      busy = false;
      const asked = pending;
      pending = null;
      if (msg.type === 'result' && asked && asked.id === msg.id && asked.epoch === epoch) {
        applyResult(msg.result, asked);
        const done = waiters; waiters = [];
        done.forEach((resolve) => resolve(msg.result));
      }
      if (wantMatch && video.paused) { wantMatch = false; tick(true); }
    } else if (msg.type === 'fatal') {
      engineEl.textContent = `${msg.message}. Check the connection and reload.`;
    }
  };
  worker.onerror = (e) => { engineEl.textContent = `Matcher worker failed: ${e.message}`; };

  function sendConfig() {
    worker.postMessage({ type: 'config', method: methodSel.value, akazeThreshold: +$('akazeThreshold').value });
  }

  // ---------- Reference ----------

  function drawRefCanvas() {
    const ctx = refCanvas.getContext('2d');
    if (!refImage) { ctx.clearRect(0, 0, refCanvas.width, refCanvas.height); return; }
    const cssW = refCanvas.clientWidth || 320;
    const scale = cssW / refImage.naturalWidth;
    refCanvas.width = Math.round(cssW);
    refCanvas.height = Math.round(refImage.naturalHeight * scale);
    ctx.drawImage(refImage, 0, 0, refCanvas.width, refCanvas.height);
    const box = dragBox || crop;
    if (box) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.beginPath();
      ctx.rect(0, 0, refCanvas.width, refCanvas.height);
      ctx.rect(box.x * scale, box.y * scale, box.w * scale, box.h * scale);
      ctx.fill('evenodd');
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2;
      ctx.strokeRect(box.x * scale, box.y * scale, box.w * scale, box.h * scale);
    }
  }

  function buildReference() {
    reference = null;
    resetTracking();
    if (!workerReady || !refImage) return;
    const region = crop || { x: 0, y: 0, w: refImage.naturalWidth, h: refImage.naturalHeight };
    const baseScale = Math.min(1, REF_BASE / Math.max(region.w, region.h));
    const baseW = Math.max(1, Math.round(region.w * baseScale));
    const baseH = Math.max(1, Math.round(region.h * baseScale));
    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently: true });
    const levels = [];
    for (const s of REF_SCALES) {
      const w = Math.round(baseW * s), h = Math.round(baseH * s);
      if (Math.min(w, h) < REF_MIN_SIDE) continue;
      work.width = w; work.height = h;
      wctx.imageSmoothingQuality = 'high';
      wctx.drawImage(refImage, region.x, region.y, region.w, region.h, 0, 0, w, h);
      const image = wctx.getImageData(0, 0, w, h);
      levels.push({ s, image: { data: image.data.buffer, width: w, height: h } });
    }
    refInfo.textContent = 'Reading the reference…';
    worker.postMessage({ type: 'reference', levels, w: baseW, h: baseH, hasCrop: crop !== null }, levels.map((l) => l.image.data));
  }

  // ---------- Candidate state ----------

  function dropTrack() {
    state.quad = null; state.points = []; state.status = 'scanning'; state.stable = 0; state.misses = 0;
  }

  function resetTracking() {
    dropTrack();
    state.last = null;
    epoch++;
    counts.processed = 0; counts.matched = 0; counts.likely = 0; counts.msTotal = 0;
    if (workerReady) worker.postMessage({ type: 'reset' });
    render();
  }

  // A paused video shows one frame, so the outline for it never goes stale
  const sinceSeen = () => (video.paused ? 0 : performance.now() - state.lastSeenAt);

  function applyResult(result, asked) {
    const c = cfg();
    const now = performance.now();
    counts.processed++;
    counts.msTotal += result.ms;
    state.last = { ...result, latency: now - asked.sentAt };
    if (result.quad !== null && result.inliers >= c.potential) {
      // The answer describes the frame that was sent; the picture has moved on since, so carry it forward
      let quad = result.quad, points = result.points;
      if (!asked.broken) {
        const carried = quad.map((p) => applyH(asked.H, p));
        if (isUsableQuad(carried, asked.w, asked.h)) { quad = carried; points = points.map((p) => applyH(asked.H, p)); }
      }
      const size = Math.sqrt(quadArea(quad));
      const near = state.quad && Math.hypot(centre(quad).x - centre(state.quad).x, centre(quad).y - centre(state.quad).y) < size * 0.6;
      if (near) {
        state.stable++;
        quad = state.quad.map((p, i) => ({ x: p.x + (quad[i].x - p.x) * SMOOTH_ALPHA, y: p.y + (quad[i].y - p.y) * SMOOTH_ALPHA }));
      } else {
        // A jump is a new candidate and has to earn its stability again
        state.stable = 1;
        state.status = 'potential';
      }
      state.quad = quad; state.points = points; state.frameW = asked.w; state.frameH = asked.h;
      state.lastSeenAt = now; state.misses = 0;
      if (result.inliers >= c.likely && state.stable >= c.stableFrames) state.status = 'likely';
      else if (state.status !== 'likely') state.status = 'potential';
      counts.matched++;
      if (state.status === 'likely') counts.likely++;
    } else if (state.quad) {
      state.misses++;
      if (state.misses >= MAX_MISSES || video.paused) dropTrack();
    }
    render();
  }

  function render() {
    statusEl.className = state.quad ? state.status : '';
    if (!refImage || !video.src) statusEl.textContent = 'Pick a reference photo and a video';
    else if (!reference) statusEl.textContent = workerReady ? 'Reading the reference…' : 'Loading the matcher…';
    else if (!state.quad) statusEl.textContent = 'Scanning…';
    else if (state.misses > 0) statusEl.textContent = 'Candidate not confirmed, checking again…';
    else if (state.status === 'likely') statusEl.textContent = 'Likely match. Check the name and dates.';
    else statusEl.textContent = 'Potential match';

    const r = state.last;
    const lines = [];
    if (r) {
      lines.push(`frame features ${r.frameFeatures}   ratio-test matches ${r.good}   inliers ${r.inliers}   match ${r.ms.toFixed(0)} ms   answer age ${r.latency.toFixed(0)} ms`);
      lines.push(`stable matches ${state.stable}   misses ${state.misses}   follow step ${trackMs.toFixed(0)} ms`);
    }
    if (counts.processed > 0) {
      lines.push(`frames matched ${counts.matched} of ${counts.processed}   likely ${counts.likely}   average ${(counts.msTotal / counts.processed).toFixed(0)} ms per match`);
    }
    readoutEl.textContent = lines.join('\n');
  }

  // ---------- Frame loop ----------

  function resetFlow() {
    if (prevGray) { prevGray.delete(); prevGray = null; }
    if (pending) pending.broken = true;
  }

  // One displayed frame: follow the outline with optical flow, then hand the frame to the matcher if it is free.
  // force is for a paused frame (seek, new reference), where there is nothing to follow from.
  function tick(force) {
    if (!video.videoWidth) return;
    const s = Math.min(1, cfg().procSize / Math.max(video.videoWidth, video.videoHeight));
    const w = Math.round(video.videoWidth * s), h = Math.round(video.videoHeight * s);
    if (procCanvas.width !== w || procCanvas.height !== h) { procCanvas.width = w; procCanvas.height = h; resetFlow(); dropTrack(); }

    if (cv) {
      const started = performance.now();
      const fw = Math.max(1, Math.round(w * FLOW_SCALE)), fh = Math.max(1, Math.round(h * FLOW_SCALE));
      if (flowCanvas.width !== fw || flowCanvas.height !== fh) { flowCanvas.width = fw; flowCanvas.height = fh; }
      fctx.drawImage(video, 0, 0, fw, fh);
      const rgba = cv.matFromImageData(fctx.getImageData(0, 0, fw, fh)), gray = new cv.Mat();
      cv.cvtColor(rgba, gray, cv.COLOR_RGBA2GRAY);
      rgba.delete();
      if (force) resetFlow();
      if (prevGray && (state.quad || pending)) {
        const sx = fw / w, sy = fh / h;
        let H = null;
        try {
          const small = stepHomography(prevGray, gray, state.quad && state.quad.map((p) => ({ x: p.x * sx, y: p.y * sy })));
          // Measured on the small copy; express it in matched-frame pixels
          if (small) H = mul3([1 / sx, 0, 0, 0, 1 / sy, 0, 0, 0, 1], mul3(small, [sx, 0, 0, 0, sy, 0, 0, 0, 1]));
        } catch (err) { console.error(err); }
        if (H) {
          if (pending) pending.H = mul3(H, pending.H);
          if (state.quad) {
            const moved = state.quad.map((p) => applyH(H, p));
            if (isUsableQuad(moved, w, h)) { state.quad = moved; state.points = state.points.map((p) => applyH(H, p)); } else dropTrack();
          }
        } else if (pending) pending.broken = true;
        trackMs = performance.now() - started;
      }
      if (prevGray) prevGray.delete();
      prevGray = gray;
    }

    if (!workerReady || !reference) return;
    if (busy) { if (force) wantMatch = true; return; }
    const now = performance.now();
    if (!force && now - lastSentAt < 1000 / cfg().maxRate) return;
    busy = true;
    lastSentAt = now;
    const c = cfg();
    pctx.drawImage(video, 0, 0, w, h);
    const image = pctx.getImageData(0, 0, w, h);
    pending = { id: ++nextId, epoch, H: IDENTITY, broken: false, w, h, sentAt: now };
    worker.postMessage({ type: 'match', id: pending.id, image: { data: image.data.buffer, width: w, height: h }, ratio: c.ratio, potential: c.potential }, [image.data.buffer]);
  }

  const hasFrameCallback = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
  let lastTickAt = 0;
  function onVideoFrame() {
    scheduleFrame();
    if (!video.paused && !video.ended) { lastTickAt = performance.now(); tick(false); }
  }
  // Chrome slows frame callbacks to about one a second when the window is covered or in the background.
  // A plain timer keeps the frames coming then; it stays out of the way while the callbacks are healthy.
  setInterval(() => {
    if (video.paused || video.ended || performance.now() - lastTickAt < 120) return;
    lastTickAt = performance.now();
    tick(false);
  }, 40);
  function scheduleFrame() {
    if (hasFrameCallback) video.requestVideoFrameCallback(onVideoFrame);
    else requestAnimationFrame(onVideoFrame);
  }

  // ---------- Overlay ----------

  function fitOverlay() {
    const dpr = window.devicePixelRatio || 1;
    // The element letterboxes the picture when the aspect ratios differ, so cover the picture, not the element
    const boxW = video.clientWidth, boxH = video.clientHeight;
    const aspect = video.videoWidth && video.videoHeight ? video.videoWidth / video.videoHeight : boxW / Math.max(boxH, 1);
    let w = boxW, h = boxW / aspect;
    if (h > boxH) { h = boxH; w = boxH * aspect; }
    overlay.style.left = `${(boxW - w) / 2}px`;
    overlay.style.top = `${(boxH - h) / 2}px`;
    overlay.style.width = `${w}px`;
    overlay.style.height = `${h}px`;
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (overlay.width !== pw || overlay.height !== ph) { overlay.width = pw; overlay.height = ph; }
  }

  function drawOverlay() {
    requestAnimationFrame(drawOverlay);
    fitOverlay();
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    if (!state.quad) return;
    const age = sinceSeen();
    if (age > HOLD_MS) { dropTrack(); render(); return; }
    const alpha = age <= FADE_FROM_MS ? 1 : 1 - (age - FADE_FROM_MS) / (HOLD_MS - FADE_FROM_MS);
    const dpr = window.devicePixelRatio || 1;
    const kx = overlay.width / state.frameW, ky = overlay.height / state.frameH;
    const colour = state.status === 'likely' ? '#22c55e' : '#f59e0b';

    ctx.globalAlpha = alpha;
    ctx.beginPath();
    state.quad.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x * kx, p.y * ky) : ctx.lineTo(p.x * kx, p.y * ky)));
    ctx.closePath();
    ctx.fillStyle = colour + '22';
    ctx.fill();
    ctx.lineWidth = 3 * dpr;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = colour;
    ctx.stroke();

    if ($('showPoints').checked) {
      ctx.fillStyle = '#ffffff';
      for (const p of state.points) { ctx.beginPath(); ctx.arc(p.x * kx, p.y * ky, 2 * dpr, 0, Math.PI * 2); ctx.fill(); }
    }

    const label = state.status === 'likely' ? 'Likely match' : 'Potential match';
    const top = state.quad.reduce((a, b) => (b.y < a.y ? b : a));
    const cx = centre(state.quad).x * kx;
    ctx.font = `600 ${13 * dpr}px system-ui, sans-serif`;
    const tw = ctx.measureText(label).width + 14 * dpr;
    const th = 22 * dpr;
    const lx = Math.min(Math.max(cx - tw / 2, 4 * dpr), overlay.width - tw - 4 * dpr);
    const ly = Math.max(top.y * ky - th - 8 * dpr, 4 * dpr);
    ctx.fillStyle = colour;
    ctx.fillRect(lx, ly, tw, th);
    ctx.fillStyle = '#04110b';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, lx + 7 * dpr, ly + th / 2);
    ctx.globalAlpha = 1;
  }

  // ---------- Inputs ----------

  let dragStart = null, dragBox = null;
  const toImage = (e) => {
    const rect = refCanvas.getBoundingClientRect();
    const k = refImage.naturalWidth / rect.width;
    return {
      x: Math.min(Math.max((e.clientX - rect.left) * k, 0), refImage.naturalWidth),
      y: Math.min(Math.max((e.clientY - rect.top) * k, 0), refImage.naturalHeight),
    };
  };
  refCanvas.addEventListener('pointerdown', (e) => {
    if (!refImage) return;
    refCanvas.setPointerCapture(e.pointerId);
    dragStart = toImage(e);
  });
  refCanvas.addEventListener('pointermove', (e) => {
    if (!dragStart) return;
    const p = toImage(e);
    dragBox = { x: Math.min(p.x, dragStart.x), y: Math.min(p.y, dragStart.y), w: Math.abs(p.x - dragStart.x), h: Math.abs(p.y - dragStart.y) };
    drawRefCanvas();
  });
  refCanvas.addEventListener('pointerup', () => {
    if (!dragStart) return;
    dragStart = null;
    // A click without a drag leaves the crop alone
    if (dragBox && dragBox.w > 20 && dragBox.h > 20) { crop = dragBox; buildReference(); }
    dragBox = null;
    drawRefCanvas();
  });
  $('refWhole').addEventListener('click', () => { crop = null; drawRefCanvas(); buildReference(); });

  $('refFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => { refImage = img; crop = null; drawRefCanvas(); buildReference(); };
    img.onerror = () => { refInfo.textContent = 'That photo could not be opened.'; };
    img.src = URL.createObjectURL(file);
  });

  $('videoFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (video.src) URL.revokeObjectURL(video.src);
    video.src = URL.createObjectURL(file);
    video.playbackRate = +$('rate').value;
    resetFlow();
    resetTracking();
  });
  video.addEventListener('error', () => { statusEl.textContent = 'This browser cannot play that video. Try an MP4 (H.264).'; });
  // A seek breaks the chain of frames, so nothing in flight or being followed survives it
  video.addEventListener('seeking', () => { epoch++; resetFlow(); dropTrack(); });
  // Scrubbing while paused matches the frame under the playhead
  video.addEventListener('seeked', () => { if (video.paused) tick(true); });
  video.addEventListener('loadeddata', () => tick(true));

  $('rate').addEventListener('change', () => { video.playbackRate = +$('rate').value; });
  $('resetStats').addEventListener('click', resetTracking);
  methodSel.addEventListener('change', () => { sendConfig(); buildReference(); });
  $('akazeThreshold').addEventListener('change', () => { sendConfig(); buildReference(); });
  window.addEventListener('resize', drawRefCanvas);

  scheduleFrame();
  drawOverlay();
  waitForCv().catch(() => { /* matching still works; the outline just won't be followed between matches */ });
  // For poking at the matcher from the console. nextResult resolves with the next answer that was applied.
  window.stoneMatcher = { state, counts, nextResult: () => new Promise((resolve) => waiters.push(resolve)) };
})();
</script>
<script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js"></script>
</body>
