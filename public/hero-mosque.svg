<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8ECE9"/>
      <stop offset="60%" stop-color="#D5DFD9"/>
      <stop offset="100%" stop-color="#C2D0C8"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6F887C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#466054" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4D3E"/>
      <stop offset="100%" stop-color="#1B382C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" fill="url(#sky)"/>

  <!-- Distant mountain ridges -->
  <path d="M0 160 Q180 120 380 145 T800 130 L800 240 L0 240 Z" fill="#9FB5AA" opacity="0.4"/>

  <!-- Midground Mosque Domes and Minarets -->
  <g fill="url(#silhouette)">
    <!-- Minaret 1 Left -->
    <rect x="120" y="70" width="12" height="130" rx="3"/>
    <polygon points="126,35 118,70 134,70"/>
    <rect x="116" y="90" width="20" height="6" rx="2"/>
    <circle cx="126" cy="30" r="3"/>

    <!-- Central Dome 1 -->
    <path d="M160 170 C160 110 230 110 230 170 Z"/>
    <circle cx="195" cy="105" r="4"/>

    <!-- Large Central Grand Mosque -->
    <path d="M340 170 C340 90 460 90 460 170 Z"/>
    <polygon points="400,65 396,95 404,95"/>
    <circle cx="400" cy="60" r="4"/>
    <rect x="330" y="160" width="140" height="40"/>

    <!-- Minaret 2 Center Right -->
    <rect x="475" y="55" width="14" height="145" rx="3"/>
    <polygon points="482,20 473,55 491,55"/>
    <rect x="471" y="80" width="22" height="7" rx="2"/>
    <circle cx="482" cy="15" r="3.5"/>

    <!-- Minaret 3 Far Right -->
    <rect x="650" y="85" width="12" height="115" rx="3"/>
    <polygon points="656,50 648,85 664,85"/>
    <circle cx="656" cy="45" r="3"/>
    <!-- Small Dome Right -->
    <path d="M580 175 C580 125 630 125 630 175 Z"/>
  </g>

  <!-- Foreground Cypress Trees / Cemetery foliage silhouettes -->
  <g fill="url(#fore)">
    <path d="M40 240 C35 190 45 160 50 140 C55 160 65 190 60 240 Z"/>
    <path d="M70 240 C67 200 73 175 76 155 C79 175 85 200 82 240 Z"/>
    <path d="M270 240 C264 195 274 165 278 145 C282 165 292 195 286 240 Z"/>
    <path d="M520 240 C515 190 525 160 530 135 C535 160 545 190 540 240 Z"/>
    <path d="M730 240 C725 185 735 155 740 130 C745 155 755 185 750 240 Z"/>
    <!-- Gentle ground base -->
    <path d="M0 215 Q200 195 400 210 T800 200 L800 240 L0 240 Z"/>
  </g>
</svg>
