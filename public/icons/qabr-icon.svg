<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143A2E"/>
      <stop offset="100%" stop-color="#0B231B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="100%" stop-color="#C5A059"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Islamic Geometric Octagram / Arch -->
  <path d="M256 90 C180 180, 150 250, 150 330 C150 390, 195 430, 256 430 C317 430, 362 390, 362 330 C362 250, 332 180, 256 90 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Mosque Dome Silhouette -->
  <path d="M256 120 C235 180, 205 240, 205 310 L307 310 C307 240, 277 180, 256 120 Z" 
        fill="url(#goldGrad)" opacity="0.9"/>
        
  <!-- Base arch foundation -->
  <path d="M190 310 L322 310 L322 350 L190 350 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M236 350 C236 335, 276 335, 276 350 Z" fill="#143A2E"/>

  <!-- Crescent & Star finial at apex -->
  <circle cx="256" cy="76" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="260" cy="73" r="11" fill="#143A2E"/>
  <circle cx="252" cy="74" r="3.5" fill="url(#goldGrad)"/>
  
  <!-- GPS Pin Radar Rings -->
  <circle cx="256" cy="380" r="8" fill="#10B981"/>
  <circle cx="256" cy="380" r="22" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="380" r="36" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
</svg>
